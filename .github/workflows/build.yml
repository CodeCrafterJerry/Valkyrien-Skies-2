name: Build Mod (26.3)

on:
  push:
    branches: [ "1.20.1/playtest" ]
  pull_request:
    branches: [ "1.20.1/playtest" ]
  workflow_dispatch:  # 支持手动触发

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 设置 JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. 设置 Gradle（自动缓存依赖，加速后续构建）
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. 赋予 gradlew 执行权限
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 5. 使用 Gradle 编译 Mod
      - name: Build with Gradle
        run: ./gradlew build forge

      # 6. 上传编译产物到 Action 文件区域
      - name: Upload Mod Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mod-Build-1.20.1
          path: build/libs/*.jar
          if-no-files-found: warn
